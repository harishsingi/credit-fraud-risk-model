[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-fraud-risk-model"
version = "0.2.0"
description = "Interpretable fraud-risk scoring demo on fully synthetic data (pure Python, no ML framework)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
credit-fraud-generate = "credit_fraud.generate_data:main"
credit-fraud-train = "credit_fraud.train:main"
credit-fraud-score = "credit_fraud.score:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
